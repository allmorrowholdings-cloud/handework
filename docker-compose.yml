services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: handework
      MYSQL_USER: handework
      MYSQL_PASSWORD: handework_local_password
      MYSQL_ROOT_PASSWORD: handework_local_root_password
    ports:
      - "3306:3306"
    volumes:
      - handework_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phandework_local_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - handework_redis:/data
volumes:
  handework_mysql:
  handework_redis:
